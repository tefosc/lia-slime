# Al subir una etiqueta v*: compila el instalador de Windows, calcula los
# SHA-256 y crea una release en BORRADOR. No firma nada y no usa secretos de
# firma: la firma está pendiente (ver docs/firma.md).
# La release nunca se publica sola: se revisa y se publica a mano.
name: Release

on:
  push:
    tags: ["v*"]

# Por defecto, solo lectura. El único trabajo que escribe lo pide abajo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Solo en el repositorio original: un fork no crea releases de este proyecto.
    if: github.repository == 'tefosc/lia-slime'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Necesario para crear la release en borrador. El token solo se entrega
      # al último paso; los pasos de compilación no lo reciben.
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Comprobar la etiqueta
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "La etiqueta no está en la rama main." }
          "VERSION=$version" >> $env:GITHUB_ENV

      # Lee la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Sin caché de pnpm ni de cargo: el artefacto se compila desde cero.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Preparar Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw "Falló pnpm build." }
          pnpm verificar
          if ($LASTEXITCODE -ne 0) { throw "Falló pnpm verificar." }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Falló cargo test." }

      # Sin firma: scripts/firmar-windows.ps1 no firma si falta
      # LIA_FIRMA_PROVEEDOR, y este flujo no la define ni recibe secretos de
      # firma. Ver docs/firma.md.
      - name: Compilar el instalador
        run: |
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) { throw "Falló pnpm tauri build." }

      # Tauri nombra el instalador con el nombre del producto, que lleva un
      # espacio ("Lia Slime_X.Y.Z_x64-setup.exe"). GitHub cambia los espacios
      # de los archivos de una release, así que se publica con guion: el
      # nombre de SHA256SUMS.txt y el del archivo descargado coinciden.
      - name: Nombre del instalador
        run: |
          $salida = "src-tauri/target/release/bundle/nsis"
          $instaladores = @(Get-ChildItem $salida -Filter *.exe)
          if ($instaladores.Count -ne 1) { throw "Se esperaba un instalador y hay $($instaladores.Count)." }
          $esperado = "Lia Slime_${env:VERSION}_x64-setup.exe"
          if ($instaladores[0].Name -ne $esperado) {
            throw "El instalador se llama '$($instaladores[0].Name)' y se esperaba '$esperado'."
          }
          $publicado = "Lia-Slime_${env:VERSION}_x64-setup.exe"
          Rename-Item $instaladores[0].FullName $publicado
          "INSTALADOR=$publicado" >> $env:GITHUB_ENV

      - name: Hashes y estado de la firma
        run: |
          $salida = "src-tauri/target/release/bundle/nsis"
          $archivo = Get-Item "$salida/$env:INSTALADOR"
          $linea = "{0}  {1}" -f (Get-FileHash $archivo.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $archivo.Name
          # Formato de sha256sum, con saltos de línea de Unix.
          [IO.File]::WriteAllText("$salida/SHA256SUMS.txt", "$linea`n")
          "SHA-256 del artefacto:"
          $linea
          # Solo informa: este flujo no firma.
          $firma = Get-AuthenticodeSignature $archivo.FullName
          "{0}: firma {1}" -f $archivo.Name, $firma.Status
          "FIRMADO=$($firma.Status -eq 'Valid')" >> $env:GITHUB_ENV

      - name: Crear la release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $salida = "src-tauri/target/release/bundle/nsis"
          $aviso = if ($env:FIRMADO -eq 'True') {
            "El instalador está firmado."
          } else {
            "**El instalador no está firmado.** Windows SmartScreen mostrará un aviso al abrirlo. Comprueba el SHA-256 antes de instalar (ver el README)."
          }
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          $cerca = '```'
          $notas = @(
            "Lia Slime $env:VERSION", "",
            $aviso, "",
            "Compilado en GitHub Actions por el flujo público [release.yml]($repo/blob/$env:GITHUB_SHA/.github/workflows/release.yml) de este repositorio, a partir de la etiqueta $env:GITHUB_REF_NAME (commit $env:GITHUB_SHA), sin caché. [Registro de la ejecución]($repo/actions/runs/$env:GITHUB_RUN_ID).", "",
            "SHA-256:", "", $cerca, (Get-Content "$salida/SHA256SUMS.txt" -Raw).TrimEnd(), $cerca, "",
            "Cambios: ver [CHANGELOG.md]($repo/blob/$env:GITHUB_REF_NAME/CHANGELOG.md).", "",
            "## Code signing policy", "",
            "Estado: **pendiente**. Los binarios de esta versión **no están firmados**; todavía no hay ningún acuerdo de firma.", "",
            "- Committers and reviewers: [@tefosc](https://github.com/tefosc)",
            "- Approvers: [@tefosc](https://github.com/tefosc)",
            "- Privacy policy: [docs/privacidad.md]($repo/blob/$env:GITHUB_REF_NAME/docs/privacidad.md). This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it.", "",
            "Política completa: [README]($repo/blob/$env:GITHUB_REF_NAME/README.md#code-signing-policy)."
          ) -join "`n"
          Set-Content notas.md $notas
          $archivos = @("$salida/$env:INSTALADOR", "$salida/SHA256SUMS.txt")
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Lia Slime $env:VERSION" --notes-file notas.md @archivos
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la release en borrador." }
