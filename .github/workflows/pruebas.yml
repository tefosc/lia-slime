# Pruebas en cada pull request y en cada push a main. No usa secretos.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el flujo solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # Lia es una app de Windows: las pruebas de Rust se compilan allí.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lee la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos y compilar el frontend
        run: pnpm build

      - name: Verificar el detector de mareo
        run: pnpm verificar

      # Rust estable ya viene en el runner; se actualiza con rustup.
      - name: Preparar Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Pruebas de Rust
        working-directory: src-tauri
        run: cargo test --locked
