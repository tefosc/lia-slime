[package]
name = "lia"
version = "0.1.0"
description = "Mascota flotante que vigila agentes de código"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: icono en la bandeja del sistema.
tauri = { version = "2", features = ["tray-icon"] }
# Plugins oficiales de Tauri (tauri-apps/plugins-workspace), serie 2.
# Una sola instancia: evita dos receptores peleando por el mismo puerto.
tauri-plugin-single-instance = "2"
# Inicio con Windows (clave de usuario, sin permisos de administrador).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: al reescribir el settings.json de Claude Code no se
# reordenan sus claves.
serde_json = { version = "1", features = ["preserve_order"] }
# Token aleatorio del receptor de eventos (crate oficial de rust-random).
getrandom = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
